<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="tc" content="#F3F5F8">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Catatan Keuangan</title>
<style>
:root{--bg:#F3F5F8;--card:#FFFFFF;--ink:#1E2733;--mute:#667386;--line:#E2E7EE;--accent:#4A74A6;--on:#FFFFFF;--in:#3F8A6D;--out:#BC5E57;--warn-bg:#FBF1DA;--warn-ink:#5E4A14;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11151B;--card:#1A2029;--ink:#E7EBF1;--mute:#97A3B4;--line:#2A323E;--accent:#8FB0DD;--on:#0F1620;--in:#7CC3A5;--out:#E39A94;--warn-bg:#3A3220;--warn-ink:#E8CF8E;color-scheme:dark}}
:root[data-theme=dark]{--bg:#11151B;--card:#1A2029;--ink:#E7EBF1;--mute:#97A3B4;--line:#2A323E;--accent:#8FB0DD;--on:#0F1620;--in:#7CC3A5;--out:#E39A94;--warn-bg:#3A3220;--warn-ink:#E8CF8E;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 26px 26px;padding:calc(10px + env(safe-area-inset-top,0px)) clamp(16px,5vw,28px) 22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mo{display:flex;align-items:center;font-weight:600}
.mo button{background:none;border:0;color:var(--mute);font-size:26px;width:44px;height:44px;cursor:pointer}
.mo span{min-width:8.5em;text-align:center}
.tbtn{border:1px solid var(--line);background:none;color:var(--mute);border-radius:999px;padding:6px 12px;min-height:36px;font:inherit;font-size:13px;cursor:pointer}
.lbl{margin:10px 0 0;color:var(--mute);font-size:14px}
.big{margin:2px 0 0;font-size:clamp(34px,10vw,48px);font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.big.neg{color:var(--out)}
.meter{height:6px;border-radius:3px;background:var(--line);margin-top:16px;overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:3px;background:var(--accent);transition:width .3s}
.meter.over i{background:var(--out)}
.sub{display:flex;gap:24px;margin-top:12px;font-size:14px;color:var(--mute)}
.sub b{color:var(--ink);font-weight:600}
main{padding:clamp(14px,4vw,24px)}
label{display:block;margin:18px 0 6px;font-size:14px;color:var(--mute)}
input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
#amt{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:999px;font:inherit;cursor:pointer;min-height:44px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.chips .addc{border-style:dashed;color:var(--mute)}
.chips .xc{border-color:var(--out);color:var(--out)}
.newc{display:flex;gap:8px;margin-top:10px}
.newc input{flex:1}
.newc button{border:0;border-radius:12px;background:var(--accent);color:var(--on);font:inherit;font-weight:600;padding:0 18px;cursor:pointer}
.primary{width:100%;margin-top:24px;padding:14px;border:0;border-radius:14px;background:var(--accent);color:var(--on);font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.ghost{width:100%;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
h3{margin:22px 0 8px;font-size:14px;color:var(--mute);font-weight:600}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:6px}
.row>div{flex:1;min-width:0}
.row small{display:block;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row span{font-weight:600;font-variant-numeric:tabular-nums}
.row .out{color:var(--out)}.row .in{color:var(--in)}
.del{border:0;background:none;color:var(--mute);padding:10px 6px;font:inherit;font-size:13px;cursor:pointer}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{margin:0 0 12px}
.dn{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.donut{width:150px;height:150px;flex:none;transform:rotate(0deg)}
.dt1{font-size:2.6px;fill:var(--mute)}.dt2{font-size:4.2px;font-weight:700;fill:var(--ink)}
.lg{list-style:none;margin:0;padding:0;flex:1;min-width:150px}
.lg li{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.lg li span{flex:1}.lg li b{font-weight:600;font-variant-numeric:tabular-nums}.lg li small{color:var(--mute);width:2.8em;text-align:right}
.lg i,.key i{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.trend{width:100%;height:auto;display:block}
.ax{font-size:10px;fill:var(--mute)}
.key{display:flex;gap:16px;margin-top:8px;font-size:13px;color:var(--mute)}
.key span{display:flex;align-items:center;gap:6px}
.empty{color:var(--mute);padding:24px 0;text-align:center}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}
#warn{display:block;width:100%;text-align:left;border:0;background:var(--warn-bg);color:var(--warn-ink);padding:12px 20px;font:inherit;font-size:14px;cursor:pointer}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:16px 0;font:inherit;font-weight:600;color:var(--mute);cursor:pointer}
nav button[aria-current=page]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden],#warn[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="mo"><button id="prev" aria-label="Bulan sebelumnya">‹</button><span id="mlabel"></span><button id="next" aria-label="Bulan berikutnya">›</button></div>
    <button id="theme" class="tbtn" aria-label="Ganti tema"></button>
  </div>
  <p class="lbl">Sisa bulan ini</p>
  <p id="bal" class="big">Rp 0</p>
  <div class="meter" aria-hidden="true"><i id="mtr"></i></div>
  <div class="sub"><span>Masuk <b id="tin"></b></span><span>Keluar <b id="tout"></b></span></div>
</header>
<button id="warn" hidden></button>
<main>
  <section id="v-add">
    <div class="seg" id="seg"><button data-t="out" class="on">Keluar</button><button data-t="in">Masuk</button></div>
    <label for="amt">Jumlah (Rp)</label>
    <input id="amt" inputmode="numeric" autocomplete="off" placeholder="0">
    <label>Kategori</label>
    <div id="chips" class="chips"></div>
    <div id="newc" class="newc" hidden><input id="newcat" maxlength="20" placeholder="Nama kategori baru" autocomplete="off"><button id="addcat">Tambah</button></div>
    <label for="note">Catatan (opsional)</label>
    <input id="note" maxlength="80" autocomplete="off">
    <label for="dt">Tanggal</label>
    <input id="dt" type="date">
    <button id="save" class="primary">Simpan</button>
  </section>
  <section id="v-list" hidden></section>
  <section id="v-sum" hidden></section>
</main>
<nav>
  <button data-v="add" aria-current="page">Catat</button>
  <button data-v="list">Riwayat</button>
  <button data-v="sum">Ringkasan</button>
</nav>
<div id="toast" role="status"></div>
<input id="file" type="file" accept=".json,application/json" hidden>

<script>
// Kategori awal. Kategori lain ditambah lewat tombol "+ Kategori" di aplikasi.
const DEF={out:['Makan','Transportasi','Tagihan','Cicilan','Belanja'],in:['Gaji']};

const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const pad=n=>String(n).padStart(2,'0');
const rp=n=>'Rp\u00a0'+Math.round(n).toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const sum=(L,t)=>L.filter(x=>x.type===t).reduce((s,x)=>s+x.amount,0);

let db,rows=[],type='out',cat='',mk=today().slice(0,7),persisted=false;

/* ---------- Kategori ---------- */
let custom={out:[],in:[]},mg=false;
try{const c=JSON.parse(LS.get('cats'));['out','in'].forEach(t=>{if(Array.isArray(c[t]))custom[t]=c[t].map(x=>String(x).trim().slice(0,20)).filter(Boolean)})}catch(e){}
const saveCats=()=>LS.set('cats',JSON.stringify(custom));
const same=(a,b)=>a.toLowerCase()===b.toLowerCase();
const used=(t,c)=>rows.some(r=>r.type===t&&same(r.cat,c));
function cats(t){const s=[];[...DEF[t],...custom[t],...rows.filter(r=>r.type===t).map(r=>r.cat)].forEach(c=>{if(!s.some(x=>same(x,c)))s.push(c)});return s}
function addCat(t,name){name=String(name).replace(/\s+/g,' ').trim().slice(0,20);if(!name)return '';const f=cats(t).find(c=>same(c,name));if(f)return f;custom[t].push(name);saveCats();return name}

/* ---------- IndexedDB ---------- */
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('keuangan',1);r.onupgradeneeded=()=>r.result.createObjectStore('tx',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const store=m=>db.transaction('tx',m).objectStore('tx');
const load=async()=>{rows=await req(store('readonly').getAll())};
const replaceAll=list=>new Promise((res,rej)=>{const t=db.transaction('tx','readwrite'),s=t.objectStore('tx');s.clear();list.forEach(x=>s.add(x));t.oncomplete=res;t.onerror=()=>rej(t.error)});

/* ---------- UI ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800)}
function show(v){['add','list','sum'].forEach(k=>$('#v-'+k).hidden=k!==v);$$('nav button').forEach(b=>b.ariaCurrent=b.dataset.v===v?'page':null)}
function chips(){
  const L=cats(type),del=c=>custom[type].some(x=>same(x,c))&&!used(type,c),any=L.some(del);
  if(!any)mg=false;
  $('#chips').innerHTML=L.map(c=>mg&&del(c)?`<button data-x="${esc(c)}" class="xc">${esc(c)} ×</button>`:`<button data-c="${esc(c)}" class="${same(c,cat)?'on':''}">${esc(c)}</button>`).join('')+`<button data-add class="addc">+ Kategori</button>`+(any?`<button data-mg class="addc">${mg?'Selesai':'Kelola'}</button>`:'');
}
function shift(n){let[y,m]=mk.split('-').map(Number);m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}mk=y+'-'+pad(m);render()}
const fmtDay=d=>new Date(d+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});

function render(){
  const L=rows.filter(t=>t.date.startsWith(mk)),[y,m]=mk.split('-').map(Number);
  const tin=sum(L,'in'),tout=sum(L,'out'),bal=tin-tout;
  $('#mlabel').textContent=new Date(y,m-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  $('#bal').textContent=(bal<0?'−':'')+rp(Math.abs(bal));
  $('#tin').textContent=rp(tin);$('#tout').textContent=rp(tout);
  const pct=tin>0?Math.min(100,tout/tin*100):(tout>0?100:0);$('#mtr').style.width=pct+'%';$('#mtr').parentNode.classList.toggle('over',tout>tin);$('#bal').classList.toggle('neg',bal<0);
  renderList(L);renderSum(L);renderWarn();chips();
}

function renderList(L){
  L=[...L].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  if(!L.length){$('#v-list').innerHTML='<p class="empty">Belum ada transaksi bulan ini. Buka tab Catat untuk menambah.</p>';return}
  let h='',d='';
  for(const t of L){
    if(t.date!==d){d=t.date;h+=`<h3>${esc(fmtDay(d))}</h3>`}
    h+=`<div class="row"><div><b>${esc(t.cat)}</b><small>${esc(t.note||'')}</small></div><span class="${t.type}">${t.type==='out'?'−':'+'}${rp(t.amount)}</span><button class="del" data-id="${t.id}">Hapus</button></div>`;
  }
  $('#v-list').innerHTML=h;
}

const PAL=['#5B84B1','#7FB3A0','#D99A7E','#A68CC4','#E0B863','#9AA7B8','#C98FA6','#6FA8B5'];
const ci=k=>Math.max(0,cats('out').findIndex(c=>same(c,k)))%PAL.length;
const short=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' jt':n>=1e3?Math.round(n/1e3)+' rb':String(Math.round(n));

function donut(e,tot){
  let off=25,s='';
  e.forEach(([k,v])=>{const p=v/tot*100;s+=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${PAL[ci(k)]}" stroke-width="5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"><title>${esc(k)}: ${rp(v)}</title></circle>`;off-=p});
  return `<svg viewBox="0 0 42 42" class="donut" role="img" aria-label="Pengeluaran per kategori"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--line)" stroke-width="5"/>${s}<text x="21" y="20" text-anchor="middle" class="dt1">Keluar</text><text x="21" y="25" text-anchor="middle" class="dt2">${short(tot)}</text></svg>`;
}

function trend(){
  const[y0,m0]=mk.split('-').map(Number),D=[];
  for(let i=5;i>=0;i--){
    const d=new Date(y0,m0-1-i,1),k=d.getFullYear()+'-'+pad(d.getMonth()+1),L=rows.filter(t=>t.date.startsWith(k));
    D.push({l:d.toLocaleDateString('id-ID',{month:'short'}),i:sum(L,'in'),o:sum(L,'out')});
  }
  const mx=Math.max(1,...D.flatMap(d=>[d.i,d.o]));let s='';
  D.forEach((d,n)=>{
    const x=14+n*50,hi=d.i/mx*100,ho=d.o/mx*100;
    s+=`<rect x="${x}" y="${110-hi}" width="16" height="${hi}" rx="3" fill="var(--in)"><title>Masuk ${rp(d.i)}</title></rect><rect x="${x+19}" y="${110-ho}" width="16" height="${ho}" rx="3" fill="var(--out)"><title>Keluar ${rp(d.o)}</title></rect><text x="${x+17.5}" y="125" text-anchor="middle" class="ax">${esc(d.l)}</text>`;
  });
  return `<svg viewBox="0 0 320 132" class="trend" role="img" aria-label="Masuk dan keluar enam bulan terakhir">${s}<line x1="8" y1="110" x2="312" y2="110" stroke="var(--line)"/></svg><div class="key"><span><i style="background:var(--in)"></i>Masuk</span><span><i style="background:var(--out)"></i>Keluar</span></div><p class="note">Batang tertinggi: ${rp(mx)}</p>`;
}

function renderSum(L){
  const by={};L.filter(t=>t.type==='out').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
  const tot=sum(L,'out'),e=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const lg=e.map(([k,v])=>`<li><i style="background:${PAL[ci(k)]}"></i><span>${esc(k)}</span><b>${rp(v)}</b><small>${Math.round(v/tot*100)}%</small></li>`).join('');
  const lb=+LS.get('lastBackup');
  $('#v-sum').innerHTML=`<div class="grid">
  <div class="card"><h3>Pengeluaran per kategori</h3>${e.length?`<div class="dn">${donut(e,tot)}<ul class="lg">${lg}</ul></div>`:'<p class="empty">Belum ada pengeluaran bulan ini.</p>'}</div>
  <div class="card"><h3>Masuk dan keluar, 6 bulan</h3>${trend()}</div></div>
  <h3>Cadangan data</h3>
  <p class="note">Data hanya ada di HP ini. Cadangan terakhir: ${lb?new Date(lb).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'belum pernah'}.</p>
  <button class="primary" id="bk-json">Ekspor cadangan (JSON)</button>
  <button class="ghost" id="bk-csv">Ekspor ke CSV (Excel)</button>
  <button class="ghost" id="bk-imp">Impor cadangan</button>
  <p class="note">Penyimpanan permanen: ${persisted?'aktif':'belum aktif, jadi cadangan lebih penting'}.</p>`;
}

function renderWarn(){
  const lb=+LS.get('lastBackup'),w=$('#warn');
  const old=!lb||Date.now()-lb>7*864e5;
  w.hidden=!(rows.length&&old);
  w.textContent='Belum ada cadangan dalam 7 hari terakhir. Ketuk di sini untuk mengekspor.';
}

/* ---------- Simpan & hapus ---------- */
async function save(){
  const amount=Number($('#amt').value.replace(/\D/g,''));
  if(!amount)return toast('Isi jumlah dulu');
  if(!cat)return toast('Pilih kategori');
  const date=$('#dt').value||today();
  await req(store('readwrite').add({date,amount,type,cat,note:$('#note').value.trim(),at:Date.now()}));
  await load();
  $('#amt').value='';$('#note').value='';
  if(date.slice(0,7)!==mk)mk=date.slice(0,7);
  render();toast('Tersimpan');$('#amt').focus();
}

/* ---------- Cadangan ---------- */
function saveFile(name,text,mime){
  const f=new File([text],name,{type:mime});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).then(()=>{LS.set('lastBackup',Date.now());render()}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);LS.set('lastBackup',Date.now());render();
}
const stamp=()=>today();
const csvCell=v=>{v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
function expJSON(){saveFile(`keuangan-${stamp()}.json`,JSON.stringify({app:'keuangan',v:2,cats:custom,tx:rows.map(({id,...r})=>r)}),'application/json')}
function expCSV(){
  const r=['Tanggal,Tipe,Kategori,Jumlah,Catatan',...[...rows].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='out'?'Keluar':'Masuk',csvCell(t.cat),t.amount,csvCell(t.note||'')].join(','))];
  saveFile(`keuangan-${stamp()}.csv`,'\ufeff'+r.join('\r\n'),'text/csv');
}
async function impJSON(file){
  try{
    const d=JSON.parse(await file.text());
    const list=(d.tx||[]).filter(t=>/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&Number.isFinite(t.amount)&&t.amount>0&&(t.type==='in'||t.type==='out')&&typeof t.cat==='string')
      .map(t=>({date:t.date,amount:t.amount,type:t.type,cat:t.cat,note:String(t.note||''),at:t.at||Date.now()}));
    if(!list.length)return toast('File tidak berisi transaksi valid');
    if(!confirm(`Ganti ${rows.length} transaksi di HP ini dengan ${list.length} transaksi dari file?`))return;
    if(d.cats)['out','in'].forEach(t=>(Array.isArray(d.cats[t])?d.cats[t]:[]).forEach(c=>addCat(t,c)));
    await replaceAll(list);await load();render();toast('Cadangan dipulihkan');
  }catch(e){toast('File tidak bisa dibaca')}
}

/* ---------- Event ---------- */
$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);
$('#seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;type=b.dataset.t;cat='';mg=false;$('#newc').hidden=true;$$('#seg button').forEach(x=>x.classList.toggle('on',x===b));chips()};
$('#chips').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if('add' in d){const p=$('#newc');p.hidden=!p.hidden;if(!p.hidden)$('#newcat').focus();return}
  if('mg' in d){mg=!mg;chips();return}
  if('x' in d){const i=custom[type].findIndex(x=>same(x,d.x));if(i>=0){custom[type].splice(i,1);saveCats();if(same(cat,d.x))cat='';chips()}return}
  cat=d.c;chips();
};
$('#addcat').onclick=()=>{const c=addCat(type,$('#newcat').value);if(!c)return toast('Isi nama kategori');cat=c;$('#newcat').value='';$('#newc').hidden=true;mg=false;chips();toast('Kategori ditambahkan')};
$('#newcat').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#addcat').click()}};
$('#amt').oninput=function(){const n=this.value.replace(/\D/g,'').slice(0,12);this.value=n?Number(n).toLocaleString('id-ID'):''};
$('#save').onclick=save;
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)};
$('#warn').onclick=()=>show('sum');
$('#v-list').onclick=async e=>{const b=e.target.closest('.del');if(!b||!confirm('Hapus transaksi ini?'))return;await req(store('readwrite').delete(Number(b.dataset.id)));await load();render();toast('Dihapus')};
$('#v-sum').onclick=e=>{const id=e.target.id;if(id==='bk-json')expJSON();else if(id==='bk-csv')expCSV();else if(id==='bk-imp')$('#file').click()};
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)impJSON(f)};

/* ---------- Tema ---------- */
const THEMES=['auto','light','dark'],TL={auto:'Otomatis',light:'Terang',dark:'Gelap'};
let theme=LS.get('theme');if(!TL[theme])theme='auto';
function applyTheme(){
  const r=document.documentElement;
  if(theme==='auto')r.removeAttribute('data-theme');else r.dataset.theme=theme;
  $('#theme').textContent='Tema: '+TL[theme];
  $('#tc').content=getComputedStyle(r).getPropertyValue('--bg').trim();
}
$('#theme').onclick=()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%3];LS.set('theme',theme);applyTheme()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);

/* ---------- Mulai ---------- */
(async()=>{
  applyTheme();$('#dt').value=today();chips();
  try{
    db=await open();await load();
    if(navigator.storage&&navigator.storage.persist){persisted=await navigator.storage.persisted()||await navigator.storage.persist()}
    render();
  }catch(e){$('main').innerHTML='<p class="empty">Penyimpanan di browser ini tidak tersedia. Coba buka lewat Chrome biasa, bukan mode penyamaran.</p>'}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
